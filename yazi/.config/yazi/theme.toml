#:schema https://yazi-rs.github.io/schemas/theme.json
# ~/.config/yazi/theme.toml
# Paul's Yazi Theme – abgestimmt auf Kitty (#FF0080 Pink / #F6AE2D Gold)

[flavor]
# Kein externer Flavor – alles direkt definiert

# ── Manager (jetzt [mgr]) ──────────────────────────────────────────────────────
[mgr]
cwd = { fg = "#F6AE2D" }                     # Aktuelles Verzeichnis: Gold

# hovered/previewed/selected gab es hier mal -- existieren in der echten Mgr-
# Struct nicht mehr (Quellcode geprueft), wurden also nie angewendet. hovered/
# previewed sind jetzt [indicator] (siehe unten). Fuer "selected" (Textfarbe
# einer markierten Zeile) gibt es kein Aequivalent mehr -- Markierung laeuft
# nur noch ueber den marker_selected-Marker unten, kein separates Textfeld.

# Mehrfach-Selektion Marker
marker_selected = { fg = "#FF0080", bg = "#FF0080" }
marker_copied   = { fg = "#F6AE2D", bg = "#F6AE2D" }
marker_cut      = { fg = "#FF0800", bg = "#FF0800" }

# Border / Rahmen der Panels
border_symbol = "│"
border_style  = { fg = "#2f2428" }           # dezent Maroon-getoent statt neutralem Grau

# ── Hervorhebung der Cursor-Zeile, je nach Pane (loest [mgr].hovered/previewed
# ab, siehe oben) -- current = aktives mittleres Pane, preview = rechtes
# Vorschau-Pane, parent = linkes Eltern-Pane ────────────────────────────────────
[indicator]
current = { bg = "#1a1a1a", bold = true }
preview = { bg = "#0d0d0d" }
parent  = { bg = "#1a1a1a" }

# ── Tabs (Neu ausgelagert) ─────────────────────────────────────────────────────
[tabs]
active   = { fg = "#000000", bg = "#FF0080", bold = true }
inactive = { fg = "#444444", bg = "#1a1a1a" }

# ── Status-Anzeige (Modus links, getrennter Top-Level-Block seit diesem Fix --
# lag vorher faelschlich als mode_normal/mode_select/mode_unset unter [status],
# wurde dadurch von yazis "custom"-Sammeltopf lautlos verschluckt statt
# angewendet, siehe [mode] unten) ──────────────────────────────────────────────
[status]
# Separatoren nutzen jetzt eine offene/geschlossene Struct-Syntax
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Mitte: Pfad/Info
progress_label  = { fg = "#dddddd", bold = true }
progress_normal = { fg = "#FF0080", bg = "#1a1a1a" }
progress_error  = { fg = "#FF0800", bg = "#1a1a1a" }

# perm_* statt permissions_* (gleicher Fix-Grund wie oben -- alte Namen
# wurden lautlos ignoriert, echte Felder laut yazi-Quellcode geprueft)
perm_sep   = { fg = "#555555" }              # Trenner zwischen den Gruppen
perm_type  = { fg = "#555555" }              # file type char (d, -, l …)
perm_read  = { fg = "#F6AE2D" }              # r – lesbar: Gold
perm_write = { fg = "#FF0080" }              # w – schreibbar: Pink
perm_exec  = { fg = "#66cc66" }              # x – ausführbar: Grün

# ── Modus-Anzeige (eigener Top-Level-Block, NICHT mehr unter [status]) ─────────
# _main = primaeres Segment (gefuellter Hintergrund), _alt = zweites Segment
# (Textfarbe auf gedaempftem Hintergrund) -- Struktur exakt aus yazis eigenem
# theme-dark.toml uebernommen, nur die Farben sind unser Pink/Gold/Grau.
[mode]
normal_main = { fg = "#000000", bg = "#FF0080", bold = true }
normal_alt  = { fg = "#FF0080", bg = "#1a1a1a" }

select_main = { fg = "#000000", bg = "#F6AE2D", bold = true }
select_alt  = { fg = "#F6AE2D", bg = "#1a1a1a" }

unset_main = { fg = "#000000", bg = "#888888", bold = true }
unset_alt  = { fg = "#888888", bg = "#1a1a1a" }

# ── Input-Prompt ───────────────────────────────────────────────────────────────
[input]
border   = { fg = "#FF0080" }                # Rahmen Pink wenn aktiv
title    = { fg = "#F6AE2D", bold = true }   # Titel Gold
value    = { fg = "#dddddd" }
selected = { reversed = true }

# ── Completion-Popup (jetzt [cmp]) ─────────────────────────────────────────────
[cmp]
border   = { fg = "#2a2a2a" }
active   = { bg = "#1a1a1a", bold = true }
inactive = { fg = "#555555" }

# ── Auswahl-Popup (bei mehreren Optionen) -- heisst inzwischen [pick], nicht
# mehr [select] (gleicher Fix-Grund wie oben) ──────────────────────────────────
[pick]
border   = { fg = "#FF0080" }
active   = { fg = "#FF0080", bold = true }
inactive = { fg = "#555555" }

# ── Tasks-Panel ────────────────────────────────────────────────────────────────
[tasks]
border  = { fg = "#2a2a2a" }
title   = { fg = "#F6AE2D", bold = true }
hovered = { bg = "#1a1a1a", bold = true }

# ── Which-Key Overlay ──────────────────────────────────────────────────────────
[which]
mask            = { bg = "#0d0d0d" }
cand            = { fg = "#FF0080" }          # Taste: Pink
rest            = { fg = "#555555" }
desc            = { fg = "#aaaaaa" }          # Beschreibung: dezentes Grau
separator       = "  "
separator_style = { fg = "#333333" }

# ── Confirm Dialog ─────────────────────────────────────────────────────────────
[confirm]
border  = { fg = "#FF0080" }
title   = { fg = "#FF0080", bold = true }
body    = { fg = "#dddddd" }          # hiess vorher "content", falscher Feldname
list    = { fg = "#aaaaaa" }
btn_yes = { fg = "#000000", bg = "#FF0080", bold = true }
btn_no  = { fg = "#dddddd", bg = "#2a2a2a" }
btn_labels = ["  Yes  ", "  No  "]

# ── Notify-Toasts ──────────────────────────────────────────────────────────────
[notify]
title_info  = { fg = "#aaaaaa", bold = true }
title_warn  = { fg = "#F6AE2D", bold = true }
title_error = { fg = "#FF0800", bold = true }
icon_info   = ""
icon_warn   = "󰀦"
icon_error  = "󰅚"

# ── Datei-Farben (Text, siehe [icon] unten fuer die Glyphen) ────────────────────
# Auf die gleiche Palette wie [icon] umgestellt (Mint/Gold/Pink) -- vorher vier
# verschiedene Blau-Toene (u.a. #7aa2f7 fuer Ordner) quer durch die Kategorien,
# das dominierte optisch alles (Ordner sind das haeufigste Element), sah dadurch
# nach generischem Terminal-Blau aus statt nach eigenem Theme. Kein Blau mehr.
[filetype]
rules = [
  # Verzeichnisse
  { url = "*/",               fg = "#AEFFD8" },       # Mint
  # Ausführbare Dateien
  { url = "*", is = "exec",   fg = "#FF0080" },       # Pink (einzige Stelle)
  # Symlinks
  { url = "*", is = "link",   fg = "#7FDEFF" },       # Himmelblau (unterscheidbar von Ordnern)
  # Fehlerhafte Symlinks
  { url = "*", is = "orphan", fg = "#FF0800" },       # Rot (Gefahr, bewusst separat)

  # --- Code ---
  { url = "*.rs",    fg = "#AEFFD8" },
  { url = "*.py",    fg = "#AEFFD8" },
  { url = "*.js",    fg = "#AEFFD8" },
  { url = "*.ts",    fg = "#AEFFD8" },
  { url = "*.jsx",   fg = "#AEFFD8" },
  { url = "*.tsx",   fg = "#AEFFD8" },
  { url = "*.go",    fg = "#AEFFD8" },
  { url = "*.c",     fg = "#AEFFD8" },
  { url = "*.cpp",   fg = "#AEFFD8" },
  { url = "*.h",     fg = "#AEFFD8" },
  { url = "*.sh",    fg = "#AEFFD8" },
  { url = "*.zsh",   fg = "#AEFFD8" },
  { url = "*.fish",  fg = "#AEFFD8" },
  { url = "*.lua",   fg = "#AEFFD8" },
  { url = "*.vim",   fg = "#AEFFD8" },
  { url = "*.nix",   fg = "#AEFFD8" },

  # --- Config / Data ---
  { url = "*.toml",  fg = "#F6AE2D" },
  { url = "*.yaml",  fg = "#F6AE2D" },
  { url = "*.yml",   fg = "#F6AE2D" },
  { url = "*.json",  fg = "#F6AE2D" },
  { url = "*.xml",   fg = "#F6AE2D" },
  { url = "*.conf",  fg = "#888888" },
  { url = "*.ini",   fg = "#888888" },
  { url = "*.env",   fg = "#888888" },

  # --- Docs ---
  { url = "*.md",    fg = "#dddddd" },
  { url = "*.txt",   fg = "#dddddd" },
  { url = "*.pdf",   fg = "#dddddd" },        # kein Rot mehr -- das ist Gefahr/Fehler vorbehalten

  # --- Media ---
  { url = "*.png",   fg = "#DABFFF" },
  { url = "*.jpg",   fg = "#DABFFF" },
  { url = "*.jpeg",  fg = "#DABFFF" },
  { url = "*.gif",   fg = "#DABFFF" },
  { url = "*.svg",   fg = "#DABFFF" },
  { url = "*.webp",  fg = "#DABFFF" },
  { url = "*.mp4",   fg = "#F6AE2D" },
  { url = "*.mkv",   fg = "#F6AE2D" },
  { url = "*.mp3",   fg = "#F6AE2D" },
  { url = "*.flac",  fg = "#F6AE2D" },

  # --- Archive ---
  { url = "*.zip",   fg = "#F6AE2D" },
  { url = "*.tar",   fg = "#F6AE2D" },
  { url = "*.gz",    fg = "#F6AE2D" },
  { url = "*.zst",   fg = "#F6AE2D" },
  { url = "*.7z",    fg = "#F6AE2D" },
  { url = "*.rar",   fg = "#F6AE2D" },

  # --- Dotfiles & Special ---
  { url = ".gitignore",  fg = "#555555" },
  { url = ".gitconfig",  fg = "#555555" },
  { url = "Makefile",    fg = "#AEFFD8" },
  { url = "Dockerfile",  fg = "#AEFFD8" },
  { url = "LICENSE",     fg = "#888888" },
  { url = "README*",     fg = "#F6AE2D" },

  # Fallback
  { url = "*", fg = "#dddddd" },
]

# ── Icons (Glyphen, getrennt von den Text-Farben oben) ─────────────────────────
# Palette: Mint (#AEFFD8) als Haupt-Akzent, Gold (#F6AE2D) fuer Config/Daten/
# Hover, Pink (#FF0080) bewusst nur an einer Stelle (exec) -- nicht #023C40/
# #4A051C hier, die sind als Vordergrund auf dunklem Terminal kaum lesbar.
[icon]
globs = []

dirs = [
  { name = ".git",     text = "", fg = "#F6AE2D" },
