  { name = "cpp",  text = "", fg = "#AEFFD8" },
  { name = "h",    text = "", fg = "#AEFFD8" },
  { name = "sh",   text = "", fg = "#AEFFD8" },
  { name = "zsh",  text = "", fg = "#AEFFD8" },
  { name = "fish", text = "", fg = "#AEFFD8" },
  { name = "lua",  text = "", fg = "#AEFFD8" },
  { name = "vim",  text = "", fg = "#AEFFD8" },
  { name = "nix",  text = "", fg = "#AEFFD8" },

